<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <linearGradient id="valleyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="valleyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="valleyGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="valleyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark background for black / near-black surfaces -->
  <rect width="880" height="240" fill="#141414"/>

  <!-- Golden-ratio base, rotated +5 deg around apex -->
  <g transform="translate(30, 20)">
    <g filter="url(#valleyGlow)" transform="translate(15, 48)">
      <path d="M -1.78 26.85 L 81 10 L 158.38 54.92 L 81.57 72.29 Z" fill="url(#valleyGrad1)"/>
      <path d="M 81.57 72.29 L 158.38 54.92 L 91.21 111.28 L 53.36 107.96 Z" fill="url(#valleyGrad2)"/>
      <path d="M 53.36 107.96 L 71.06 123.57 L 91.21 111.28 L 81.57 72.29 Z" fill="url(#valleyGrad3)" opacity="0.95"/>
    </g>

    <g transform="translate(240, 135)">
      <text x="0" y="0"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-weight="900" font-size="96" letter-spacing="2" fill="#F8FAFC">V<tspan fill="#38BDF8">-</tspan>Shift</text>
      <text x="5" y="32"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
            font-weight="700" font-size="21" letter-spacing="6" fill="#7DD3FC">SMART SHIFT MANAGER</text>
    </g>
  </g>
</svg>
